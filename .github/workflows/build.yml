name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CrispStat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrispStat-apk
          path: CrispStat.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CrispStat build ${{ github.run_number }}
          body: |
            ## CrispStat: keep your WhatsApp Status sharp

            **How to install:** tap **CrispStat.apk** under *Assets* below, then open the downloaded file. Already installed? Installing this one updates it, and your settings stay.

            **What it does**
            - Resizes videos to **720p or 1080p** at a clean quality that suits WhatsApp Status
            - Splits long videos into **30s or 60s parts**, in order
            - Resizes large photos with high quality
            - **Share to WhatsApp** in one tap → choose *My status*
            - **Save to Gallery** (Movies/CrispStat, Pictures/CrispStat)

            Requires Android 8.0 or newer. Not affiliated with WhatsApp or Meta.

            Changes in this build: ${{ github.event.head_commit.message }}
          files: CrispStat.apk
          make_latest: true
